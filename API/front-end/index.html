<!DOCTYPE html>
<html lang="en">

<head>
    <title>PhantasiAI Device</title>
    <script src="/static/chart.umd.min.js"></script>
    <script src="/static/chartjs-plugin-annotation.min.js"></script>

    <style>
        :root {
            --bg-dark: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            --bg-card: rgba(25, 25, 35, 0.85);  /* Semi-transparent dark */
            --bg-card-light: rgba(40, 40, 50, 0.7);
            --border-basic: rgba(255, 255, 255, 0.1);
            --border-glow: 0 0 20px rgba(0, 212, 255, 0.3);
            --color-primary: #00d4ff;
            --color-secondary: #7b2cbf;
            --color-text: #ffffff;
            --color-rest: #3498db;   /* Blue */
            --color-raise: #2ecc71;  /* Green */
            --color-hold: #ff1f1f;   /* Red */
            --color-lower: #ff7c27;  /* Orange */
            --color-inactive: #ccc; /* Light grey */
        }
        
        @font-face {
            font-family: 'Montserrat';
            src: url('/static/fonts/Montserrat-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 100 900;
            font-style: normal;  
        }
        * { font-family: 'Montserrat', sans-serif; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            color: var(--color-text);
        }
        
        h1 { 
            margin: 10px 15px; 
            font-size: clamp(22px, 5vw, 40px);
            background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
        }
        
        button {
            margin: 0 5px;
            padding: 5px 10px;
            cursor: pointer;
            background: var(--bg-card-light);
            border: 1px solid var(--border-basic);
            color: var(--color-text);
        }

        .main-container {
            display: flex;
            flex: 1; 
            height: calc(100vh - 80px); 
        }

        /* Left-hand side  (1/4 of page) */
        #toggleSidebarBtn {
            position: absolute;
            top: 20px;       /* Aligns with header */
            left: 15px;
            z-index: 1000;   /* Ensures it stays on top */
            background: transparent;
            border: 1px solid var(--border-basic);
            color: var(--color-text);
            font-size: 1rem;
            padding: 5px 5px;
            border-radius: 5px;
        }
        #toggleSidebarBtn:hover {
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
        }
        
        .sidebar {
            width: 25%;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            gap: 10px;
            transition: all 0.3s ease-in-out;
            overflow: hidden;
            white-space: nowrap;
        }
        .sidebar.hidden {
            width: 0 !important;
            min-width: 0 !important;
            padding: 0 !important;
            opacity: 0;
            margin: 0;
        }
        
        .controls-bar {
            height: 50%;
            margin: 10px 0;
            padding: 15px;
            background-color: var(--bg-card);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            font-size: 16px;
            overflow-y: auto;
        }
        .controls-bar select, .controls-bar input { 
            font-size: inherit;
        }

        .controls-header {
            font-size: 18px;    
            font-weight: 600;        
            text-transform: uppercase; 
            text-align: center;      
            width: 100%;         
            padding-bottom: 5px;
            border-bottom: 2px solid var(--color-primary);
            margin-bottom: 5px;
            color: var(--color-text);
        }
        
        .stream-btn-container {
            margin-top: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-top: 5px;
            padding-bottom: 5px; 
        }
        #streamBtn {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            color: var(--color-text);             
            border: 1px solid var(--color-primary); 
            padding: 10px 20px;      
            font-size: 18px;  
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #streamBtn:hover {
            box-shadow: var(--border-glow);
        }

        .terminal-container {
            height: 50%;
            max-width: 100%;
            flex-grow: 0; 
            background-color: var(--bg-card);          
            padding: 10px;
            border-radius: 5px;
            overflow-y: auto;
            overflow-x: auto;
            font-size: 12px;
            border: 2px solid #333;
            font-family: monospace !important;
            min-height: 200px;
        }
        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #2a2a2a;
            text-align: left;
            font-family: monospace !important;
            white-space: pre;
            width: max-content; 
            min-width: 100%;
        }

        /* Right-hand side  (3/4 of page) */
        .content-right {
            width: auto;
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
            height: 100%; 
            transition: all 0.3s ease-in-out;
        }

        .tab {
            flex-shrink: 0;
            border: 1px solid var(--border-basic);
            background: var(--bg-card);
            display: flex;
        }

        .tab button {
            background: var(--bg-card);
            color: var(--color-text);
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            font-size: 17px;
            transition: background-color 0.2s ease;
        }
        .tab button:hover {
            color: var(--color-primary);
            background-color: var(--bg-card-light);
        }
        .tab button.active {
            color: var(--color-text);
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--color-primary);
        }

        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid var(--border-basic);
            box-shadow: var(--border-glow);
            border-top: none;
            overflow-y: auto; 
            flex-grow: 1;
        }

        .graph-container {
            width: 90%;
            height: 500px;
            margin: 20px auto;
            border: 1px solid #ddd;
        }

        .graph-controls {
            margin: 10px 0;
            padding: 10px;
            background-color: transparent;
            border-radius: 5px;
            display: inline-block;
        }

        #Instructions {
            postion: relative;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex: 1;
            box-sizing: border-box;
        }

        #Instructions[style*="block"] {
            display: flex !important;
        }

        .trial-counter {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--color-primary); /* Uses your Cyan color */
            background-color: var(--bg-card-light);
            padding: 8px 15px;
            border-radius: 4px;
            border: 1px solid var(--border-basic);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* Subtle depth */
            letter-spacing: 1px;
        }
        
        .guide-text {
            font-size: clamp(60px, 10vw, 150px);
            font-weight: 700;     
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--color-rest);
        }

        .dots-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8vw; 
            margin: 20px;
            min-height: 80px;
        }

        .dot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.3;
        }

        .dot-circle {
            width: 6vw;
            height: 6vw;
            min-width: 40px;
            min-height: 40px;
            max-width: 90px;
            max-height: 90px;
            border-radius: 50%;
            background-color: var(--color-inactive);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .dot-wrapper.active {
            opacity: 1;
        }
        
        .dot-wrapper.active#dot-left .dot-circle { background-color: var(--color-raise);}
        .dot-wrapper.active#dot-middle .dot-circle  { background-color: var(--color-hold);}
        .dot-wrapper.active#dot-right .dot-circle { background-color: var(--color-lower);}
        
        .dots-container.resting .dot-wrapper.active .dot-circle {
            background-color: var(--color-rest) !important;
        }
    </style>
    
</head>

<body>
    <h1>PhantasiAI Dashboard</h1>

    <div class="main-container">
        
        <button id="toggleSidebarBtn" onclick="toggleSidebar()">☰</button>
        <aside class="sidebar">
            <!-- Controls -->
            <div class="controls-bar">
                <div class="controls-header">Controls</div>
                <div id="websocketStatus">WS Status: Disconnected</div>
                <div>
                    Board ID:
                    <select id="boardID">
                        <option value="Ganglion" selected>Ganglion</option>
                        <option value="Synthetic">Synthetic</option>
                    </select>
                </div>
                <div>
                    Serial Port:
                    <select id="serialPort">
                        <option value="PortA" selected>Port A</option>
                        <option value="PortB">Port B</option>
                    </select>
                </div>
                <div>
                    Trials per Analysis:
                    <input type="number" id="trialInput" min="1" max="15" step="1" value="10" style="width: 50px;">
                </div>
                <div>
                    Total Trials:
                    <input type="number" id="totalTrials" min="30" max="180" step="6" value="90" style="width: 50px;">
                </div>
                <div>
                    Data Folder [Optional]:
                    <input type="text" id="folderName" value="Auto" style="width: 100px;" 
                        onfocus="if(this.value==='Auto') this.value='';" 
                        onblur="if(this.value==='') this.value='Auto';" >
                </div>
                <div> Streaming Status: <span id="streamingStatus">Idle</span> 
                </div>
                <div> <span id="markerCountdownDisplay" style="font-weight: bold; color: #666;"></span>
                </div>
                <div class="stream-btn-container">
                    <button onclick="handleStreamingClick()" id="streamBtn">Start</button>
                </div>
            </div>

            <!-- Chat  -->
            <div class="terminal-container" id="chatTerminal">
                <div class="log-entry">[System] Terminal initialized...</div>
            </div>
        </aside>

        <main class="content-right">
            <div class="tab">
                <button class="tablinks" onclick="openTab(event, 'Graphs')" id="defaultOpen">Graphs</button>
                <button class="tablinks" onclick="openTab(event, 'Instructions')">Real-Time Guide</button>
            </div>
            
            <!-- Graphs -->
            <div id="Graphs" class="tabcontent">
                <!-- EMG -->
                <div> 
                    <div class="graph-controls">
                        <strong>EMG Data </strong>
                        <button onclick="zoomEMGIn()">Zoom In</button>
                        <button onclick="zoomEMGOut()">Zoom Out</button>
                        <button onclick="resetEMGZoom()">Reset</button>
                        <button onclick="togglePauseGraph()" id="pauseGraphBtn">Pause Graphs</button>
                    </div>
                </div>
                <div class="graph-container">
                    <canvas id="emgGraph"></canvas>
                </div>
            
                <!-- Accelerometer -->
                <div>
                    <div class="graph-controls">
                        <strong>Accelerometer Data </strong>
                        <button onclick="zoomAccelIn()">Zoom In</button>
                        <button onclick="zoomAccelOut()">Zoom Out</button>
                        <button onclick="resetAccelZoom()">Reset</button>
                        <button onclick="togglePauseGraph()" id="pauseGraphBtn">Pause Graphs</button>
                    </div>
                </div>
                <div class="graph-container">
                    <canvas id="accelGraph"></canvas>
                </div>
            </div>

            <!-- Real-Time Instructions -->
            <div id="Instructions" class="tabcontent">
                <div id="movementGuide" class="guide-text">REST</div>
                <div id="movementVisuals" class="dots-container">
                    <div id="dot-left" class="dot-wrapper"><div class="dot-circle"></div></div>
                    <div id="dot-middle" class="dot-wrapper"><div class="dot-circle"></div></div>
                    <div id="dot-right" class="dot-wrapper"><div class="dot-circle"></div></div>
                </div>
                <div id="trialCounterDisplay" class="trial-counter">Trials Remaining: --</div>
            </div>            
        </main>
    </div>

    <script>

        // Global variables
        let ws = null;
        let emgGraph = null;
        let accelGraph = null;
        let annotations = [];
        let pendingEmgData = []; // EMG Data Buffer
        let pendingAccelData = []; // Accel Data Buffer
        let nextEventTargetTime = null;
        let currTrials = 0;
        const defaultTotalTrials = 90;
        const defaultNumTrials = 10;

        let isStreaming = false;
        let isStopping = false;
        let renderLoopRunning = false
        
        // Instructions
        const PHASE_CHANGE = 3.0;
        let lastPhase = ""; // stores only the instruction
        let lastInstructionPhase = ""; // stores instruction + active dot
        
        // Graph configuration
        const Y_ZOOM_FACTOR = 1.5; // controls how aggressive the Y zoom is
        const WINDOW_SIZE = 5; // Controls x-axis window size (seconds)
        let SAMPLE_RATE = 200; // Default sample rate (for Ganglion)
        let MAX_DATA_POINTS = WINDOW_SIZE * SAMPLE_RATE; // Limit data for scrolling graph
        let isGraphPaused = false; // tracks whether the graphs are paused or not

        document.addEventListener('DOMContentLoaded', () => {
            // Setup UI 
            initGraphs();
            setStreamingState(false, 'Idle');
            document.getElementById("defaultOpen").click()

            connectWebSocket(); // Setup client connection
        });
        
        // ----- FRONTEND CONNECTION TO SERVER (via WebSocket) ----- //
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
        
            // Connect to server via WebSocket + update server connection status
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${protocol}://${window.location.host}/ws`;
            
            try {
                ws = new WebSocket(wsUrl);
        
                ws.onopen = () => {
                    document.getElementById('websocketStatus').innerText = "WS Status: Connected";
                }
        
                // DATA COMMUNICATION 
                ws.onmessage = (event) => {
                    
                    // Update graph buffers with most recent EMG + Accel data
                    const data = JSON.parse(event.data);
                    if (data.type === 'emg_data') {
                        data.value.forEach((val, i) => {
                            pendingEmgData.push({ x: data.timestamp[i], y: val });
                        });
                    } 
                    else if (data.type === 'accel_data') {
                        data.value[0].forEach((_, i) => {
                            pendingAccelData.push({ x: data.timestamp[i],
                                                    y_x: data.value[0][i],
                                                    y_y: data.value[1][i],
                                                    y_z: data.value[2][i] });
                        });
                    }
                    
                    // Add most recent event markers (vertical lines)
                    else if (data.type === 'event_times') {
                        data.timestamps.forEach(event_time => {
                        updateEventDisplay(event_time);
                        });
                    }
                    
                    // Update marker display and exercise instructions
                    else if (data.type === 'marker_target_time') {
                        nextEventTargetTime = data.target_timestamp;
                    }

                    // Update chat-terminal
                    else if (data.type === 'server_log') {
                        addLog(data.message);
                    }

                    // Handle command responses (success/error feedback)
                    else if (data.status) {
                        console.log("Server Response:", data);
                
                        if (data.status === 'error') {
                            alert("Server Error: " + data.message);
                            // Force the UI back to idle if start failed
                            setStreamingState(false, 'Error', 'red');
                            renderLoopRunning = false;
                        } 
                        else if (data.status === 'success') {
                            console.log("Command executed successfully:", data.message);
                        }
                    }
                }
        
                ws.onclose = async (event) => {
                    console.warn("WebSocket Error:", event);
                    await stopStream(); // auto stop if WS disconnects
                    setStreamingState(false, "Disconnected", "red");
                    document.getElementById('websocketStatus').innerText = "WS Status: Disconnected";
                    ws = null;
                };
        
                ws.onerror = async (error) => {
                    console.error("WebSocket Error:", error);
                    await stopStream(); // auto stop if WS error
                    setStreamingState(false, "Connection Error", "red");
                    document.getElementById('websocketStatus').innerText = "WS Status: Connection Error";
                    ws = null;
                }
            } catch (e) {
                console.error("Failed to create WebSocket:", e);
            }
        }

        // ----- TAB CONTROL -----//
        function openTab(evt, tabName) {
            // Hide all elements of previously active tab
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
        
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
        
            // Show the current tab
            const activeTab = document.getElementById(tabName);
            if (tabName === "Instructions") {
                activeTab.style.display = "flex"; // This enables vertical centering
            } else {
                activeTab.style.display = "block";
            }
            evt.currentTarget.className += " active";
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const btn = document.getElementById('toggleSidebarBtn');
            
            // Toggle the class
            sidebar.classList.toggle('hidden');
            
            // Resize graphs if they are currently visible
            window.dispatchEvent(new Event('resize'));
        }
        
        // ----- CHAT WINDOW ----- //
        function addLog(message) {
            const terminal = document.getElementById('chatTerminal');
            
            // Add new message to the bottom
            terminal.innerHTML += `<div class="log-entry">${message}</div>`;
            
            // Auto-scroll to the bottom
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        // ----- REAL-TIME VISUALS ----- //
        function updateTimerVisuals(currentTime) {
            if (nextEventTargetTime === null) return;

            let timeRemaining = Math.max(0, nextEventTargetTime - currentTime);
            
            updateMarkerCountdown(timeRemaining);
            updateTrialCountdown(timeRemaining);
            updateMovementGuide(timeRemaining);
        }
          
        // ----- EVENT MARKER TIMER ----- //
        function updateMarkerCountdown(timeRemaining) {
            const display = document.getElementById('markerCountdownDisplay');
            
            const formattedTime = timeRemaining.toFixed(1) + "s";
            const targetText = `NEXT MARKER: ${formattedTime}`;
             
            if (display.innerText !== targetText) {
                if (timeRemaining < PHASE_CHANGE) { // Detect rest period
                    display.style.color = 'blue'; 
                } 
                else {// Detect event marker (movement begins)
                    display.style.color = 'green';
                }

                display.innerText = targetText;
            }
        }

        // ----- TRIAL COUNTER ----- //
        async function updateTrialCountdown(timeRemaining) {
            const totalTrialsInput = document.getElementById('totalTrials');
            const totalTrials = totalTrialsInput ? parseFloat(totalTrialsInput.value) : defaultTotalTrials;
            const display = document.getElementById('trialCounterDisplay');

            if (!display) return;

            let currentPhase = (timeRemaining <= PHASE_CHANGE) ? "REST" : "GO";
            
            // Increment trials after switching from GO to REST
            if (lastPhase === "GO" && currentPhase === "REST") {
                currTrials += 1;
                console.log("Trial Complete! Total:", currTrials);
            }

            lastPhase = currentPhase;
            let trialsRemaining = (totalTrials - currTrials);

            // Check for auto-stop if total trials complete
            if (trialsRemaining <= 0 && isStreaming && !isStopping) {
                console.log("All trials complete. Auto-stopping...");
                isStopping = true;
                await stopStream(); 
                display.innerText = `Trials Remaining: 0`;
                isStopping = false;
                return;
            }
            
            // Update trial display
            const newText = `Trials Remaining: ${Math.max(0, trialsRemaining)}`;
            if (display.innerText !== newText) {
                display.innerText = newText;
            }
        }

                
        // ----- EXERCISE INSTRUCTIONS ----- //
        // Basic go-rest display
        function updateMovementGuide(timeRemaining) {
            const instruction = document.getElementById('movementGuide');
            const dotContainer = document.getElementById('movementVisuals');
            const dots = {
                left:   document.getElementById('dot-left'),
                middle: document.getElementById('dot-middle'),
                right:  document.getElementById('dot-right')
            };

            if (!instruction) return;
            
            let phase = "";
            let color = "";
            let activeDot = "";

            if (timeRemaining <= PHASE_CHANGE) { // REST PHASE
                phase = "REST";
                color = "var(--color-rest)"; // Blue
                const timeElapsed = PHASE_CHANGE - timeRemaining;
                if (timeElapsed < 1.0) activeDot = "left";
                else if (timeElapsed < 2.0) activeDot = "middle";
                else activeDot = "right";
            } 
            else {  // GO PHASES
                const timeInGO = timeRemaining - PHASE_CHANGE;

                if (timeInGO > ((PHASE_CHANGE / 3.0) * 2.0)) {
                    phase = "RAISE";
                    color = "var(--color-raise)"; // Green
                    activeDot = "left";
                } else if (timeInGO > (PHASE_CHANGE / 3.0)) {
                    phase = "HOLD";
                    color = "var(--color-hold)"; // Red
                    activeDot = "middle";
                } else {
                    phase = "LOWER";
                    color = "var(--color-lower)"; // Orange
                    activeDot = "right";
                }
            }

            // DOM updates (optimized): text + colors + dots
            if (phase + activeDot !== lastInstructionPhase) {
                instruction.innerText = phase;
                instruction.style.color = color;
                
                if (phase === "REST") {
                    dotContainer.classList.add('resting');
                } else {
                    dotContainer.classList.remove('resting');
                }
                
                Object.values(dots).forEach(d => d.classList.remove('active'));
                if (dots[activeDot]) {
                    dots[activeDot].classList.add('active');
                }
                
                lastInstructionPhase = phase + activeDot;
            }
            
        }
        
        // ----- EMG & ACCEL GRAPHS ----- //
        
        // Initialize Graphs //
        function getCommonChartOptions(yLabel) {
            return {
                animation: false,
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: true },
                    annotation: { annotations: [] } // event marker lines
                },
                parsing: false, // disable automatic parsing 
                normalized: true, // data is already sorted 
                scales: { 
                    x: { 
                        type: 'linear',
                        min: undefined,
                        max: undefined,
                        title: { display: true, text: 'Time (s)' },
                        id: 'x', // reference for annotations 
                        ticks: { display: true, color: 'black', maxRotation: 0, minRotation: 0, autoSkip: true, maxTicksLimit: 10,
                                callback: function(value) {
                                    const numericValue = parseFloat(this.getLabelForValue(value));
                                    return Number.isFinite(numericValue) ? numericValue.toFixed(1) : this.getLabelForValue(value); }
                                }, 
                        grid: { display: true, lineWidth: 0.5 }
                    }, 
                    y: { 
                        title: { display: true, text: yLabel },
                        grid: { display: true, lineWidth: 0.5 }
                    }}
            }
        };
        
        function initGraphs() {
            
            // 1: EMG Graph
            const ctxEmg = document.getElementById('emgGraph').getContext('2d');
            emgGraph = new Chart(ctxEmg, {
                type: 'line',
                data: { 
                    datasets: [{
                        label: 'Channel 1 (EMG Signal)',
                        data: [], 
                        borderColor: 'blue',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1 // Change for slight curve
                    }]
                },
                options: getCommonChartOptions('Amplitude (µV)') 
            });
            
            // 2: Accel Graph
            const ctxAccel = document.getElementById('accelGraph').getContext('2d');
            accelGraph = new Chart(ctxAccel, {
                type: 'line',
                data: { 
                    datasets: [
                        { label: 'X', data: [], borderColor: 'red', borderWidth: 1.5, pointRadius: 0 },
                        { label: 'Y', data: [], borderColor: 'green', borderWidth: 1.5, pointRadius: 0 },
                        { label: 'Z', data: [], borderColor: 'blue', borderWidth: 1.5, pointRadius: 0 }
                    ]
                },
                options: getCommonChartOptions('G-Force') 
            });
        
        }
        
        // Graph Display + Timed Visuals Logic (using render loops) //
        function startRenderLoop() {
            if (renderLoopRunning) return;

            renderLoopRunning = true;
            requestAnimationFrame(renderLoop);
        }
        
        function renderLoop() {
            if (!renderLoopRunning) return;
            
            if (!isGraphPaused) {
                batchUpdateGraph(emgGraph, pendingEmgData, 'emg');
                batchUpdateGraph(accelGraph, pendingAccelData, 'accel');

                if (emgGraph && emgGraph.data && Array.isArray(emgGraph.data.datasets) &&
                    emgGraph.data.datasets.length > 0 && emgGraph.data.datasets[0].data.length > 0
                ) {
                    const lastEmgPoint = emgGraph.data.datasets[0].data[emgGraph.data.datasets[0].data.length - 1];
                    
                    if (lastEmgPoint && lastEmgPoint.x !== undefined) {
                        updateTimerVisuals(lastEmgPoint.x);
                    }
                }
            }
            requestAnimationFrame(renderLoop); // Continue looping
        }
        
        function batchUpdateGraph(chart, buffer, type) {
            if (!chart || buffer.length === 0) return;
        
            // 1: Push all pending data to Chart dataset
            if (type === 'emg') {
                chart.data.datasets[0].data.push(...buffer);
            } 
            else if (type == 'accel') {
                buffer.forEach(pt => {
                    chart.data.datasets[0].data.push({ x: pt.x, y: pt.y_x });
                    chart.data.datasets[1].data.push({ x: pt.x, y: pt.y_y });
                    chart.data.datasets[2].data.push({ x: pt.x, y: pt.y_z });
                });
            }
        
            buffer.length = 0 // 2: Clear buffer
        
            // 3: Prune graph (along x-axis) 
            const currentLength = chart.data.datasets[0].data.length;
            if (currentLength > MAX_DATA_POINTS) {
                const removeCount = currentLength - MAX_DATA_POINTS;
                chart.data.datasets.forEach(dataset => {
                    dataset.data.splice(0, removeCount);
                });
            }
        
            // 4: Update x-axis (time) window 
            const lastPoint = chart.data.datasets[0].data[chart.data.datasets[0].data.length - 1];
            if (lastPoint) {
                const latestTime = lastPoint.x;
                
                // Manually set the view window for smooth scrolling effect
                chart.options.scales.x.min = latestTime - WINDOW_SIZE;
                chart.options.scales.x.max = latestTime;
            }
        
            // 5: Marker interval filtering
            chart.options.plugins.annotation.annotations = annotations.filter(a => 
                a.value >= chart.options.scales.x.min && 
                a.value <= chart.options.scales.x.max
            );
        
            chart.update('none'); // 6: Render
        }
        
        // Event Marker Logic //
        function updateEventDisplay(timestamp) {
            if (isGraphPaused) return;
            
            timestamp = Number(timestamp);
            
            const annotationConfig = {
            type: 'line',
            mode: 'vertical',
            scaleID: 'x',
            value: timestamp,
            borderColor: 'red',
            borderWidth: 1,
            label: {
                content: 'EVENT',
                enabled: true,
                position: 'top',
                backgroundColor: 'rgba(255, 0, 0, 0.7)',
                color: 'white'
                }
            };
        
            annotations.push(annotationConfig); // update annotations
        }
        
        // Graph Control Functions //
        // Pause control for BOTH graphs (synchronized)
        function togglePauseGraph() {
            isGraphPaused = !isGraphPaused;
            document.getElementById('pauseGraphBtn').innerText = isGraphPaused ? 'Resume Graphs' : 'Pause Graphs';
            
            // If resumed, force update both graphs immediately
            if (!isGraphPaused) {
                redrawEMGGraph();
                redrawAccelGraph();
            }
        }
        
        // Zoom control functions
        // 1: Calculate min/max of graphs current data
        function getGraphRangeY(graph) {
            let min = Infinity;
            let max = -Infinity;
            let hasData = false;
        
            // Loop through all datasets (handles Accel X, Y, Z simultaneously)
            graph.data.datasets.forEach(dataset => {
                dataset.data.forEach(point => {
                    // Handle data whether it is a raw number (EMG) or an object {x, y} (Accel)
                    const val = (typeof point === 'object' && point !== null) ? point.y : point;
                    
                    if (val < min) min = val;
                    if (val > max) max = val;
                    hasData = true;
                });
            });
        
            if (!hasData || min === Infinity || max === -Infinity) return null;
            
            // Add a tiny buffer if flatline
            if (min === max) {
                min -= 1;
                max += 1;
            }
            return { min, max };
        }
        
        // 2: Zoom in/out Function
        function applyZoom(graph, factor) {
            if (!graph) return;
        
            // Get current scale limits
            let currentMin = graph.options.scales.y.min;
            let currentMax = graph.options.scales.y.max;
        
            // If manual zoom isn't set yet, calculate it from the data
            if (currentMin === undefined || currentMax === undefined) {
                const limits = getGraphRangeY(graph);
                if (!limits) return; // No data to zoom on
                currentMin = limits.min;
                currentMax = limits.max;
            }
        
            // Calculate center and span
            const center = (currentMin + currentMax) / 2;
            const span = (currentMax - currentMin);
            
            // Apply Zoom Factor (newSpan = oldSpan * factor)
            // Factor < 1 zooms IN (smaller span), Factor > 1 zooms OUT (larger span)
            const newHalfSpan = (span * factor) / 2;
        
            graph.options.scales.y.min = center - newHalfSpan;
            graph.options.scales.y.max = center + newHalfSpan;
            
            graph.update('none');
        }
        
        // 3: Reset function
        function resetZoom(graph) {
            if (!graph) return;
            // deleting min/max returns Chart.js to "Auto-Scale" mode
            delete graph.options.scales.y.min;
            delete graph.options.scales.y.max;
            graph.update('none');
        }
        
        // EMG zoom controls
        function zoomEMGIn() { applyZoom(emgGraph, 1 / Y_ZOOM_FACTOR); }
        function zoomEMGOut() { applyZoom(emgGraph, Y_ZOOM_FACTOR); }
        function resetEMGZoom() { resetZoom(emgGraph); }
        
        // Accelerometer zoom controls
        function zoomAccelIn() { applyZoom(accelGraph, 1 / Y_ZOOM_FACTOR); }
        function zoomAccelOut() { applyZoom(accelGraph, Y_ZOOM_FACTOR); }
        function resetAccelZoom() { resetZoom(accelGraph); }
        
        
        // ----- STREAMING ---- //
        
        // Streaming Control Helper //
        function setStreamingState(active, statusMessage, color="333") {
            isStreaming = active;
            const button = document.getElementById('streamBtn');
            const input = document.getElementById('trialInput');
            const trials = document.getElementById('totalTrials');
            const boardId = document.getElementById('boardID');
            const serialPort = document.getElementById('serialPort');
            const folderName = document.getElementById('folderName');
            const status = document.getElementById('streamingStatus');
        
            if (button) {
                button.innerText = active ? 'Stop' : 'Start';
                button.disabled = false;
            }
            
            // Lock input while active
            if (input) input.disabled = active;
            if (trials) trials.disabled = active;
            if (boardId) boardId.disabled = active;
            if (serialPort) serialPort.disabled = active;
            if (folderName) folderName.disabled = active;
        
            if (status) {
                status.innerText = statusMessage;
                status.style.color = color;
            }
        }
        
        // Main Sreaming Logic //
        async function handleStreamingClick() {
            // Case 1: Stop streaming + recording
            if (isStreaming) {
                await stopStream();
                return
            }
        
            // Case 2: Start streaming + recording
            const boardID = document.getElementById('boardID').value;
            let useSyntheticData = false;
            if (boardID === "Synthetic") { 
                useSyntheticData = true;
                SAMPLE_RATE = 250;
            } else if (boardID === "Ganglion") {
                useSyntheticData = false;
                SAMPLE_RATE = 200;
            }
            MAX_DATA_POINTS = SAMPLE_RATE * WINDOW_SIZE 

            const serialPort = document.getElementById('serialPort').value;
            let portToUse = 'serial_port_A';
            if (serialPort === "PortA") {
                portToUse = 'serial_port_A';
            } else if (serialPort === "PortB") {
                portToUse = 'serial_port_B';
            }
            
            const trialInput = document.getElementById('trialInput').value;
            const numTrials = parseFloat(trialInput);
            if (isNaN(numTrials) || numTrials < 1 || numTrials > 15) {
                numTrials = defaultNumTrials;
            }

            const folderName = document.getElementById('folderName').value;
            let folderToUse = (folderName === 'Auto' || folderName === '') ? null : folderName;
        
            // Lock controls before async loop starts and start main countdown
            document.getElementById('streamBtn').disabled = true;
            document.getElementById('trialInput').disabled = true;
            document.getElementById('boardID').disabled = true;
            document.getElementById('serialPort').disabled = true;
            document.getElementById('totalTrials').disabled = true;
            document.getElementById('folderName').disabled = true;
        
            const status = document.getElementById('streamingStatus');
            status.style.color = '#e65100'; // Orange for warning
        
            for (let i = 3; i > 0; i--) {
                status.innerText = `Starting in ${i}...`;
                
                // Wait 1 second
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            status.innerText = "Initializing...";
            
            // Send number of trials per session and start stream + recording
            await startStream(numTrials, useSyntheticData, portToUse, folderToUse);
        }
        
        function handleReset() {
            // Reset ALL Buffers and States
            pendingEmgData.length = 0;
            pendingAccelData.length = 0;
            lastInstructionPhase = "";
            nextEventTargetTime = null;
            currTrials = 0;
            lastPhase = "";
            isGraphPaused = false;
            resetEMGZoom();
            resetAccelZoom();
            document.getElementById('pauseGraphBtn').innerText = 'Pause Graphs';
            document.getElementById('streamBtn').disabled = false; // Enable stream + recording
            document.getElementById('trialInput').disabled = false;
            document.getElementById('boardID').disabled = false;
            document.getElementById('serialPort').disabled = false;
            document.getElementById('totalTrials').disabled = false;
            
            // Clear the synchronized marker countdown display
            const display = document.getElementById('markerCountdownDisplay');
            if (display) {
                display.innerText = "";
                display.style.color = 'blue';
            }

            // Clear trial countdown
            const trials = document.getElementById('trialCounterDisplay');
            if (trials) {
                trials.innerText = "Trials Remaining: --";
            }

            // Set instructions guide to default
            const instruction = document.getElementById('movementGuide');
            if (instruction) {
                instruction.innerText = "REST";
                instruction.style.color = "#3498db"; // Default Blue
            }

            // Reset dots to default
            const dotContainer = document.getElementById('movementVisuals');
            if (dotContainer) {
                dotContainer.classList.add('resting');
                document.querySelectorAll('.dot-wrapper').forEach(d => d.classList.remove('active'));
            }

            // Clear graphs and event marker displays
            annotations.length = 0; 
            [emgGraph, accelGraph].forEach(graph => {
                if(graph && graph.options.plugins && graph.options.plugins.annotation) {
                    graph.data.datasets.forEach(d => d.data = []);
                    graph.options.plugins.annotation.annotations = [];
                    graph.update('none');
                }
            });
        }
        
        async function startStream(numTrials, useSyntheticData, portToUse, folderToUse)  {
            // If websocket closed/not auto created, attempt connection
            if (!ws || ws.readyState === WebSocket.CLOSED) {
                connectWebSocket();
            }
            
            // Wait briefly if connecting
            if (ws.readyState === WebSocket.CONNECTING) {
                let attempts = 0;
                while (ws.readyState === WebSocket.CONNECTING && attempts < 10) {
                    await new Promise(r => setTimeout(r, 100));
                    attempts++;
                }
            }
            
            // Final check for WS connection before streaming 
            if (ws.readyState !== WebSocket.OPEN) {
                alert("Connection is not ready. Please check the WS Status.");
                return;
            }

            // Prepare backend command payload
            const payload = {
                action: "start_stream",
                serial_port: portToUse,
                num_trials: numTrials,
                synthetic: useSyntheticData,
                folder_name: folderToUse
            };
        
            try { 
                // Reset global states and visual elements
                handleReset();
                startRenderLoop();

                ws.send(JSON.stringify(payload)); // Send start command to server
                setStreamingState(true, `Active`, 'green'); // update UI
            
            } catch (error) { 
                console.error(error);
                setStreamingState(false, 'Error Starting', 'red');
                alert("Error sending start command: " + error.message);
            }
        }
        
        async function stopStream() {
            try {
                // Lock button briefly
                document.getElementById('streamBtn').disabled = true; 
                document.getElementById('streamingStatus').innerText = "Stopping...";
                
                // Send stop command to server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: "stop_stream" }));
                }

                // Reset UI
                handleReset();
                setStreamingState(false, 'Idle', '#333');
                renderLoopRunning = false;
            
            } catch (e) {
                console.error(e);
                alert("Error stopping");
                setStreamingState(true, 'Error Stopping', 'red'); // Revert if failed
            }
        }
        
    </script>
